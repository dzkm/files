general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba($mauveAlphaee) rgba($pinkAlphaee) 45deg
    col.inactive_border = rgba($surface0Alphaaa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
    
    snap {
        enabled = false
    } 	
}

dwindle {
    pseudotile = true
    preserve_split = true
}
